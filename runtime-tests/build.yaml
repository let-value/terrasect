# Terrasect runtime-test BUILD descriptors.
#
# One BUILD scenario per supported (loader, minecraft) lane. Each boots the locally built Terrasect
# jar (via :<loader>:<segment>:jar) through HeadlessMC and asserts the Terrasect init marker.
#
# These are the local-jar lanes; PUBLISHED lanes (same versions resolved from the registries) are
# described separately in published-modrinth.yaml / published-curseforge.yaml, and COMPAT modpack
# scenarios in compat.yaml.
#
# Header (mod_id / latest / mod_version) must match the host build; the validate task fails if not.

mod_id: terrasect
latest: "26.2"
mod_version: "0.2.3"

scenarios:
  - mc: "1.20.1"
    loader: fabric
    scenario: BUILD
    gameVersions: ["1.20.1"]
    dependencies: []
    note: "1.20.1 is fabric-only (single-lane legacy target)."

  - mc: "1.21.1"
    loader: fabric
    scenario: BUILD
    gameVersions: ["1.21.1"]
    dependencies: []

  - mc: "1.21.1"
    loader: neoforge
    scenario: BUILD
    gameVersions: ["1.21.1"]
    dependencies: []

  - mc: "1.21.11"
    loader: fabric
    scenario: BUILD
    gameVersions: ["1.21.11"]
    dependencies: []

  - mc: "1.21.11"
    loader: neoforge
    scenario: BUILD
    gameVersions: ["1.21.11"]
    dependencies: []

  - mc: "26.1"
    loader: fabric
    scenario: BUILD
    gameVersions: ["26.1"]
    dependencies: []

  - mc: "26.1"
    loader: neoforge
    scenario: BUILD
    gameVersions: ["26.1"]
    dependencies: []

  - mc: "26.2"
    loader: fabric
    scenario: BUILD
    gameVersions: ["26.2"]
    dependencies: []

  - mc: "26.2"
    loader: neoforge
    scenario: BUILD
    gameVersions: ["26.2"]
    dependencies: []
