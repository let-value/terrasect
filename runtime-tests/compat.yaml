# Terrasect runtime-test COMPAT (third-party modpack) descriptors.
#
# Boots each lane through HeadlessMC with a set of third-party mods resolved into the modpack. The
# third-party inputs below are pinned by Modrinth *version id* (the Maven coordinate used by
# e2e-compat), not by human version string — the human version is shown in the inline comment for
# review. These come straight from stonecutter.properties.toml deps.compat_* keys.
#
# NOTE: the descriptor parser (buildSrc/src/main/kotlin/YamlReader.kt) is strict and does NOT support
# multi-line / continuation values, so every value here must stay on a single physical line.
#
# Third-party compat inputs (deps.compat_*) exist in stonecutter.properties.toml ONLY for the fabric
# branch, and only for 1.21.11 / 26.1 / 26.2. The e2e-compat module that consumes these pins is
# fabric-only and does not build on 1.20.1. The NeoForge lanes (and 1.20.1) therefore have no real
# third-party inputs yet; they are represented here explicitly as deferred scenarios instead of
# being silently omitted, per the descriptor contract.

mod_id: terrasect
latest: "26.2"
mod_version: "0.2.3"

scenarios:
  - mc: "1.20.1"
    loader: fabric
    scenario: COMPAT
    gameVersions: ["1.20.1"]
    dependencies: []
    externalMods: []
    note: "Deferred: 1.20.1 is the single-lane legacy target and is not in the e2e-compat matrix, so no third-party inputs are available for this lane."

  - mc: "1.21.1"
    loader: fabric
    scenario: COMPAT
    gameVersions: ["1.21.1"]
    dependencies: []
    externalMods: []
    note: "Deferred: e2e-compat is fabric-only and has no compat pins below 1.21.11; third-party inputs are added once e2e-compat gains a 1.21.1 lane."

  - mc: "1.21.1"
    loader: neoforge
    scenario: COMPAT
    gameVersions: ["1.21.1"]
    dependencies: []
    externalMods: []
    note: "Deferred: e2e-compat is fabric-only, so no NeoForge third-party inputs are pinned; Distant Horizons has a NeoForge build upstream but its pin would have to be added to stonecutter.properties.toml."

  - mc: "1.21.11"
    loader: fabric
    scenario: COMPAT
    gameVersions: ["1.21.11"]
    dependencies: []
    externalMods:
      - name: GlitchCore
        platform: MODRINTH
        project: glitchcore
        version: CO7NeLTt
      - name: BiomesOPlenty
        platform: MODRINTH
        project: biomes-o-plenty
        version: JJKbM72H
      - name: TerraBlender
        platform: MODRINTH
        project: terrablender
        version: chxo508B
      - name: Distant Horizons
        platform: MODRINTH
        project: distanthorizons
        version: bCTilxSz
      - name: Create
        platform: MODRINTH
        project: create-fly
        version: fn0H9rSj
    note: "Real third-party inputs from stonecutter.properties.toml (deps.compat_*). C2ME is not exercised on 1.21.11: its Jar-in-Jar bundles are its own Fabric sub-mods and are skipped in build.e2e-compat.gradle.kts."

  - mc: "1.21.11"
    loader: neoforge
    scenario: COMPAT
    gameVersions: ["1.21.11"]
    dependencies: []
    externalMods: []
    note: "Deferred: e2e-compat is fabric-only, so no NeoForge third-party inputs are pinned for this lane."

