name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TERRASECT_SKIP_COMPAT: "1"

jobs:
  build:
    name: Build and stage release jars
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Release runs are rare: read whatever cache the branches seeded, never write.
          cache-read-only: true

      - name: Build all loader jars
        run: >
          ./gradlew test
          :fabric:1.20.1:build
          :fabric:1.21.1:build :neoforge:1.21.1:build
          :fabric:1.21.11:build :neoforge:1.21.11:build
          :fabric:26.1.x:build :neoforge:26.1.x:build
          :fabric:26.2.x:build :neoforge:26.2.x:build

      - name: Stage jars
        run: |
          mkdir -p dist
          MOD_VERSION=$(sed -n 's/^mod\.version = "\(.*\)"/\1/p' stonecutter.properties.toml)
          for loader in fabric neoforge; do
            for mc in 1.20.1 1.21.1 1.21.11 26.1.2 26.2; do
              if [[ "$loader" = neoforge && "$mc" = 1.20.1 ]]; then continue; fi
              case "$mc" in
                26.1.2) segment=26.1.x ;;
                26.2) segment=26.2.x ;;
                *) segment="$mc" ;;
              esac
              cp "$loader/versions/$segment/build/libs/terrasect-$loader-$MOD_VERSION+$mc.jar" dist/
            done
          done
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terrasect-jars
          path: dist/*.jar

      - name: Attach jars to draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MOD_VERSION=$(sed -n 's/^mod\.version = "\(.*\)"/\1/p' stonecutter.properties.toml)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${MOD_VERSION}"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Terrasect $MOD_VERSION" --generate-notes
          fi
          gh release upload "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --clobber
