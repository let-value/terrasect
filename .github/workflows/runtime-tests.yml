name: Runtime Tests

# Build-artifact runtime smoke matrix. This is the only job that boots the mod through
# HeadlessMC: it drives the Gradle runtime-test infrastructure (buildSrc) across every supported
# (loader, Minecraft) lane. It is deliberately separate from CI's Checks/UnitTests/loader-jobs and
# Loom/GameTest jobs so a HeadlessMC failure or a network hiccup in one lane never blocks the others.
on:
  # PRs read caches seeded on their base branch; a push to main keeps the runtime-tools cache warm.
  # (The buildSrc cache already defaults to read-only off main, which would re-download Minecraft —
  # the runtime matrix needs a writable cache, so it is expressed explicitly here.)
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The runtime matrix boots Terrasect's own built jar, so it never configures third-party compat
  # projects — no Modrinth-mod downloads during configuration, and no unrelated registry hiccup can
  # fail a lane. Compatibility coverage (a separate concern) lives in the compat descriptors.
  TERRASECT_SKIP_COMPAT: "1"

jobs:
  runtime-matrix:
    name: Runtime ${{ matrix.loader }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Exactly the 9 supported lanes, matching buildSrc/RuntimeTestPins.SUPPORTED_MATRIX and
        # the runtime-test descriptors (runtime-tests/build.yaml). Gradle is the public interface,
        # so each lane maps to one :<loader>:<segment>:runtimeTestLaunch invocation.
        include:
          - { loader: fabric, version: "1.20.1" }
          - { loader: fabric, version: "1.21.1" }
          - { loader: neoforge, version: "1.21.1" }
          - { loader: fabric, version: "1.21.11" }
          - { loader: neoforge, version: "1.21.11" }
          - { loader: fabric, version: "26.1.x" }
          - { loader: neoforge, version: "26.1.x" }
          - { loader: fabric, version: "26.2.x" }
          - { loader: neoforge, version: "26.2.x" }
    steps:
      - uses: actions/checkout@v4

      # Active version (26.2) compiles to Java 25 bytecode; the runtime-test job runs on that JDK.
      # Older lanes are still built by the same Gradle toolchain, so they share this setup.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Write on main so the runtime-tools bootstrap (HMC + Ferium download/verify) is cached
          # and reused; read-only off main would re-download those tools on every run.
          cache-read-only: false
          cache-cleanup: on-success

      # Cold run: download + verify HeadlessMC and Ferium, then boot this lane's built jar through
      # HeadlessMC. The first lane in the matrix is cold (tools downloaded); later lanes reuse the
      # warm Gradle build cache for the shared bootstrap step.
      - name: Run runtime smoke test for lane
        run: >
          ./gradlew :${{ matrix.loader }}:${{ matrix.version }}:runtimeTestLaunch
          --console=plain

      # Cold-then-warm cache assertion. The step above already executed the shared, @CacheableTask
      # runtimeTestBootstrap (the expensive HMC + Ferium download/verify). Re-running it with the
      # default (no --rerun-tasks) must therefore be UP-TO-DATE or FROM-CACHE — any re-execution
      # means a cacheable task's inputs/outputs changed and the cache is no longer effective.
      - name: Assert runtime bootstrap reused the build cache
        run: |
          ./gradlew runtimeTestBootstrap --console=plain 2>&1 | tee /tmp/warm-run.txt
          if grep -qE ':runtimeTestBootstrap (UP-TO-DATE|FROM-CACHE)$' /tmp/warm-run.txt; then
            echo "PASS: runtimeTestBootstrap was a cache hit on the warm run"
          else
            echo "FAIL: runtimeTestBootstrap re-executed instead of being UP-TO-DATE / FROM-CACHE"
            exit 1
          fi

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failure-${{ matrix.loader }}-${{ matrix.version }}
          # HMC writes its combined launcher log into the lane's runtime dir; Minecraft logs and
          # crash reports live under the same directory. These are logs only — no secrets.
          path: |
            build/runtime-tools/runtime/${{ matrix.loader }}-${{ matrix.version }}/hmc-launch.log
            build/runtime-tools/runtime/${{ matrix.loader }}-${{ matrix.version }}/logs/
            build/runtime-tools/runtime/${{ matrix.loader }}-${{ matrix.version }}/crash-reports/
          if-no-files-found: ignore
