name: Publish

# Release deployment. This is the ONLY job that ships Terrasect to Modrinth / CurseForge and it
# carries the real registry credentials, so it is manual-only (workflow dispatch). It is a small
# pipeline of three required stages:
#
#   1. preflight  — checks out the EXACT tag/release commit and proves, before anything is
#                   published, that (a) the descriptor matrix validates, (b) the release tag holds
#                   exactly the expected unique set of jars with the right version, and (c) the
#                   HeadlessMC + Ferium tool/bootstrap pipeline is warm (cached, not re-downloaded).
#                   If any step fails the release stops here — no partial publish.
#   2. publish    — per-lane mc-publish (gated on preflight via `needs:`).
#   3. post-verify — bounded, per-registry verification that resolves the EXACT just-published
#                   Terrasect version from the registry via Ferium and boots it through HeadlessMC,
#                   asserting exact-version identity; diagnostics are uploaded on failure.
#
# The runtime-test tasks used by preflight and post-verify are the same ones the CI runtime-smoke
# matrix (runtime-tests.yml) exercises; they live in buildSrc and are registered from
# RuntimeTestDsl. Task names here must stay in lockstep with those registrations — see RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the built jars (e.g. v1.0.0)"
        required: true
      target:
        description: "Where to publish"
        type: choice
        options:
          - both
          - modrinth
          - curseforge
        default: both
      version-type:
        description: "Release channel"
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PREFLIGHT — required, runs first. Checked out at the exact tag/release commit (via `ref:`) so
  # every check below runs against the same source that produced the release jars. `needs: []`
  # (implicit) means it runs unless explicitly disabled; publish has `needs: preflight`, so a
  # failed/skipped preflight blocks the publish matrix entirely.
  # ---------------------------------------------------------------------------
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout at the EXACT tag/release commit — not default HEAD. The inputs below, the jars
      # downloaded from the release, and the descriptor validation all run against this commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Writable cache so the expensive tool/bootstrap download+verify is cached and reused
          # across runs; off-main read-only would re-download HeadlessMC + Ferium every time.
          cache-read-only: false
          cache-cleanup: on-success

      - name: Read mod version (from the tag)
        id: meta
        run: |
          MOD_VERSION=$(sed -n 's/^mod\.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release jars from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'terrasect-*.jar' --dir dist || {
              echo "No terrasect-*.jar assets found on tag ${{ inputs.tag }}" >&2
              exit 1 }
          ls -l dist

      - name: Assert expected, unique release jars
        run: |
          set -euo pipefail
          MOD_VERSION="${{ steps.meta.outputs.mod_version }}"

          # Expected (loader-mc) lanes for the published matrix, decoded from jar names
          # `terrasect-<loader>-<version>+<mc>.jar`. Fabric publishes to every lane; CurseForge is
          # Forge-only, so the NeoForge lanes below are the only ones published there.
          cat > /tmp/expected.txt <<'EOF'
          fabric-1.20.1
          fabric-1.21.1
          fabric-1.21.11
          fabric-26.1
          fabric-26.2
          neoforge-1.21.1
          neoforge-1.21.11
          neoforge-26.1
          neoforge-26.2
          EOF

          # Decode every released jar into (loader, version, mc) and assert the version matches.
          : > /tmp/decoded.txt
          for jar in dist/*.jar; do
            base=$(basename "$jar" .jar)            # terrasect-<loader>-<version>+<mc>
            loader=${base#terrasect-}; loader=${loader%-*}
            rest=${base#terrasect-${loader}-}        # <version>+<mc>
            version=${rest%%+*}; mc=${rest##*+}
            if [ "$version" != "$MOD_VERSION" ]; then
              echo "FAIL: $(basename "$jar") decodes to version $version, expected $MOD_VERSION" >&2
              exit 1
            fi
            echo "${loader}-${mc}" >> /tmp/decoded.txt
          done

          # Uniqueness: the decoded lane set must equal the expected set exactly (no missing, no
          # extra, and no jar appearing twice).
          sort /tmp/decoded.txt > /tmp/decoded.sorted.txt
          if [ "$(wc -l < /tmp/decoded.txt)" -ne "$(sort -u /tmp/decoded.txt | wc -l)" ]; then
            echo "FAIL: duplicate release jars detected" >&2; exit 1
          fi
          if ! diff -q /tmp/expected.txt /tmp/decoded.sorted.txt >/dev/null; then
            echo "FAIL: released jars do not match the expected unique lane set:" >&2
            diff /tmp/expected.txt /tmp/decoded.sorted.txt || true
            exit 1
          fi
          echo "PASS: $(wc -l < /tmp/decoded.txt) unique release jar(s), version $MOD_VERSION, lanes match"

      - name: Preflight — validate descriptors + warm tool/cache pipeline
        run: ./gradlew runtimeTestInfrastructureCheck --console=plain

      - name: Assert tool/bootstrap reused the build cache (cold -> warm)
        run: |
          # runtimeTestInfrastructureCheck already executed the shared, @CacheableTask
          # runtimeTestBootstrap (HMC + Ferium download/verify). Re-running it with the default
          # (no --rerun-tasks) must therefore be UP-TO-DATE or FROM-CACHE — any re-execution means
          # the cache is no longer effective.
          ./gradlew runtimeTestBootstrap --console=plain 2>&1 | tee /tmp/warm-run.txt
          if grep -qE ':runtimeTestBootstrap (UP-TO-DATE|FROM-CACHE)$' /tmp/warm-run.txt; then
            echo "PASS: runtimeTestBootstrap was a cache hit on the warm run"
          else
            echo "FAIL: runtimeTestBootstrap re-executed instead of being UP-TO-DATE / FROM-CACHE"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PUBLISH — gated on preflight. Only runs when preflight passed (`needs: preflight`); if
  # preflight failed or was skipped, this job is skipped and nothing is published. Existing per-lane
  # mc-publish matrix, unchanged except for the `needs:` gate.
  # ---------------------------------------------------------------------------
  publish:
    name: ${{ matrix.loader }} ${{ matrix.mc }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.20.1", loader: fabric }
          - { mc: "1.21.1", loader: fabric }
          - { mc: "1.21.1", loader: neoforge }
          - { mc: "1.21.11", loader: fabric }
          - { mc: "1.21.11", loader: neoforge }
          - { mc: "26.1", loader: fabric }
          - { mc: "26.1", loader: neoforge }
          - { mc: "26.2", loader: fabric }
          - { mc: "26.2", loader: neoforge }
    steps:
      - uses: actions/checkout@v4

      - name: Read mod version
        id: meta
        run: |
          MOD_VERSION=$(sed -n 's/^mod\.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download jar from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "terrasect-${{ matrix.loader }}-*+${{ matrix.mc }}.jar" --dir dist
          ls -l dist

      - name: Resolve dependency list
        id: deps
        run: |
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            {
              echo "list<<EOF"
              echo "fabric-api(required)"
              echo "fabric-language-kotlin(required)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "list<<EOF"
              echo "kotlin-for-forge(required)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Modrinth
        if: inputs.target == 'modrinth' || inputs.target == 'both'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/terrasect-${{ matrix.loader }}-*+${{ matrix.mc }}.jar
          name: "Terrasect ${{ steps.meta.outputs.mod_version }} (${{ matrix.loader }} ${{ matrix.mc }})"
          version: "${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}-${{ matrix.loader }}"
          version-type: ${{ inputs.version-type }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          dependencies: ${{ steps.deps.outputs.list }}

      - name: Publish to CurseForge
        if: inputs.target == 'curseforge' || inputs.target == 'both'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/terrasect-${{ matrix.loader }}-*+${{ matrix.mc }}.jar
          name: "Terrasect ${{ steps.meta.outputs.mod_version }} (${{ matrix.loader }} ${{ matrix.mc }})"
          version: "${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}-${{ matrix.loader }}"
          version-type: ${{ inputs.version-type }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          dependencies: ${{ steps.deps.outputs.list }}

  # ---------------------------------------------------------------------------
  # POST-PUBLISH VERIFY (Modrinth) — bounded, per-registry verification. Resolves the EXACT just-
  # published Terrasect version from Modrinth via Ferium (no local jar) and boots it through
  # HeadlessMC, asserting exact-version identity. Modrinth resolution is public, so no registry
  # secret is required here. Runs only when target includes modrinth. Needs publish (so it runs
  # after the Modrinth lane actually shipped). Diagnostics are uploaded on failure.
  # ---------------------------------------------------------------------------
  post-publish-modrinth-verify:
    name: Verify published (Modrinth) ${{ matrix.loader }} ${{ matrix.mc }}
    needs: publish
    if: inputs.target == 'modrinth' || inputs.target == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, mc: "1.20.1", segment: "1.20.1" }
          - { loader: fabric, mc: "1.21.1", segment: "1.21.1" }
          - { loader: neoforge, mc: "1.21.1", segment: "1.21.1" }
          - { loader: fabric, mc: "1.21.11", segment: "1.21.11" }
          - { loader: neoforge, mc: "1.21.11", segment: "1.21.11" }
          - { loader: fabric, mc: "26.1", segment: "26.1.x" }
          - { loader: neoforge, mc: "26.1", segment: "26.1.x" }
          - { loader: fabric, mc: "26.2", segment: "26.2.x" }
          - { loader: neoforge, mc: "26.2", segment: "26.2.x" }
    steps:
      # Checkout at the tag that was published so the exact Terrasect version is read from it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Read mod version (from the tag)
        id: meta
        run: |
          MOD_VERSION=$(sed -n 's/^mod\.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify published Modrinth lane
        run: |
          # runtimeTestModrinthPublished resolves the published Terrasect from Modrinth via Ferium
          # and boots it, asserting the resolved jar is exactly -Pterrseaect.runtimeTestPublishedVersion.
          # One bounded retry: the registry index can lag briefly right after publish; diagnostics
          # are uploaded regardless so a propagation delay is never silent.
          for attempt in 1 2 3; do
            if ./gradlew :${{ matrix.loader }}:${{ matrix.segment }}:runtimeTestMODRINTHPublished \
              -Pterrseaect.runtimeTestPublishedVersion="${{ steps.meta.outputs.mod_version }}" \
              --console=plain; then
              echo "PASS: published Modrinth lane ${{ matrix.loader }} ${{ matrix.mc }} verified on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; registry may still be propagating" >&2
            sleep 60
          done
          echo "FAIL: published Modrinth lane ${{ matrix.loader }} ${{ matrix.mc }} did not verify after 3 attempts" >&2
          exit 1

      - name: Upload verification diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: post-publish-modrinth-failure-${{ matrix.loader }}-${{ matrix.segment }}
          # HMC log + Minecraft logs/crash under the runtime dir; Ferium resolve log/manifest under
          # the resolve dir. Logs only — no secrets.
          path: |
            build/runtime-tools/runtime/${{ matrix.loader }}-MODRINTH-${{ matrix.mc }}/hmc-launch.log
            build/runtime-tools/runtime/${{ matrix.loader }}-MODRINTH-${{ matrix.mc }}/logs/
            build/runtime-tools/runtime/${{ matrix.loader }}-MODRINTH-${{ matrix.mc }}/crash-reports/
            build/runtime-tools/resolve/published-${{ matrix.loader }}-${{ matrix.mc }}-MODRINTH/*.log
            build/runtime-tools/resolve/published-${{ matrix.loader }}-${{ matrix.mc }}-MODRINTH.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # POST-PUBLISH VERIFY (CurseForge) — same bounded verification for the CurseForge registry. Only
  # NeoForge lanes are published to CurseForge, so only those appear here. Requires the read-only
  # CURSEFORGE_API_KEY (injected at execution time, never a task input). Runs only when target
  # includes curseforge. Needs publish. Diagnostics uploaded on failure.
  # ---------------------------------------------------------------------------
  post-publish-curseforge-verify:
    name: Verify published (CurseForge) ${{ matrix.loader }} ${{ matrix.mc }}
    needs: publish
    if: inputs.target == 'curseforge' || inputs.target == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: neoforge, mc: "1.21.1", segment: "1.21.1" }
          - { loader: neoforge, mc: "1.21.11", segment: "1.21.11" }
          - { loader: neoforge, mc: "26.1", segment: "26.1.x" }
          - { loader: neoforge, mc: "26.2", segment: "26.2.x" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Read mod version (from the tag)
        id: meta
        run: |
          MOD_VERSION=$(sed -n 's/^mod\.version = "\([^"]*\)"/\1/p' stonecutter.properties.toml)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify published CurseForge lane
        env:
          # Read-only API key for the public CurseForge resolution used by Ferium. Injected into the
          # process env only — never a task input, never written to caches or logs.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # runtimeTestCurseForgePublished resolves the published Terrasect from CurseForge via
          # Ferium and boots it, asserting exact-version identity. One bounded retry for registry
          # propagation; diagnostics uploaded regardless on failure.
          for attempt in 1 2 3; do
            if ./gradlew :${{ matrix.loader }}:${{ matrix.segment }}:runtimeTestCURSEFORGEPublished \
              -Pterrseaect.runtimeTestPublishedVersion="${{ steps.meta.outputs.mod_version }}" \
              -Pterrseaect.curseForgeTerrasectProjectId=1615147 \
              --console=plain; then
              echo "PASS: published CurseForge lane ${{ matrix.loader }} ${{ matrix.mc }} verified on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; registry may still be propagating" >&2
            sleep 60
          done
          echo "FAIL: published CurseForge lane ${{ matrix.loader }} ${{ matrix.mc }} did not verify after 3 attempts" >&2
          exit 1

      - name: Upload verification diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: post-publish-curseforge-failure-${{ matrix.loader }}-${{ matrix.segment }}
          path: |
            build/runtime-tools/runtime/${{ matrix.loader }}-CURSEFORGE-${{ matrix.mc }}/hmc-launch.log
            build/runtime-tools/runtime/${{ matrix.loader }}-CURSEFORGE-${{ matrix.mc }}/logs/
            build/runtime-tools/runtime/${{ matrix.loader }}-CURSEFORGE-${{ matrix.mc }}/crash-reports/
            build/runtime-tools/resolve/published-${{ matrix.loader }}-${{ matrix.mc }}-CURSEFORGE/*.log
            build/runtime-tools/resolve/published-${{ matrix.loader }}-${{ matrix.mc }}-CURSEFORGE.txt
          if-no-files-found: ignore
