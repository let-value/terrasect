name: CI

on:
  pull_request:
  # Pushes to main keep the Gradle caches warm: PR runs can read caches created on their base
  # branch, but caches written inside a PR are invisible to other PRs.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Build checks do not need third-party compatibility projects. Runtime jobs enable them explicitly.
env:
  TERRASECT_SKIP_COMPAT: "1"

jobs:
  build:
    name: Checks, unit tests, loader builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Default is read-only off the default branch, which would re-download Minecraft,
          # NeoForm, and all dependencies on every single run.
          cache-read-only: false
          cache-cleanup: on-success

      - name: Spotless, unit tests, all loader jars
        run: >
          ./gradlew spotlessCheck test
          :fabric:1.20.1:build
          :fabric:1.21.1:build :neoforge:1.21.1:build
          :fabric:1.21.11:build :neoforge:1.21.11:build
          :fabric:26.1.x:build :neoforge:26.1.x:build
          :fabric:26.2.x:build :neoforge:26.2.x:build

  runtime:
    name: Client packs ${{ matrix.loader }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERRASECT_SKIP_COMPAT: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, version: "1.20.1" }
          - { loader: fabric, version: "1.21.1" }
          - { loader: fabric, version: "1.21.11" }
          - { loader: fabric, version: "26.1.x" }
          - { loader: fabric, version: "26.2.x" }
          - { loader: neoforge, version: "1.21.1" }
          - { loader: neoforge, version: "1.21.11" }
          - { loader: neoforge, version: "26.1.x" }
          - { loader: neoforge, version: "26.2.x" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Test packaged production and test mods
        run: >
          ./gradlew
          :${{ matrix.loader }}:${{ matrix.version }}:minecraftTestBuild
          :${{ matrix.loader }}:${{ matrix.version }}:minecraftTestCompat
          --continue --no-parallel --console=plain
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-packs-${{ matrix.loader }}-${{ matrix.version }}
          path: |
            build/minecraft-test/results/
            build/minecraft-test/logs/
            build/minecraft-test/modpacks/**/runtime-test-manifest.json
            build/minecraft-test/runtime/**/logs/
            build/minecraft-test/runtime/**/crash-reports/
          if-no-files-found: warn
