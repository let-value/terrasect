# Offline validation-expectations for the runtime-test descriptor gate.
#
# Each line asserts one behavior of the SAME parse()/validate() pipeline the acceptance gate uses.
# The real matrix is asserted separately by the positiveDir task field (set to the real
# runtime-tests/ matrix), which loads and asserts it passes. For each fixture directory below the
# task asserts that loadAll() throws an exception whose message contains EXPECTED.
#
# Columns are separated by " :: ". Column 2 is a path relative to project root.
#
# Format:  name :: relative-dir :: expected-substring

# ---- Each failure shape the card calls out must be rejected by the real validation pipeline. ----

# 1) malformed: a required top-level header is absent -> parse() throws.
malformed-missing-header :: runtime-tests-expectations/cases/malformed-missing-header :: missing mod_id

# 2) malformed: a scenario lists an unknown scenario value -> parseScenario() throws.
malformed-bad-scenario :: runtime-tests-expectations/cases/malformed-bad-scenario :: unknown scenario

# 3) unsupported: a scenario names a (loader,mc) pair not in SUPPORTED_MATRIX -> validate() throws.
unsupported-lane :: runtime-tests-expectations/cases/unsupported-lane :: Unsupported lane

# 4) missing-lane: a valid list that omits supported lanes -> validate() reports "lane missing".
missing-lane :: runtime-tests-expectations/cases/missing-lane :: lane missing

# 5) header mismatch: two manifests in one dir disagree on the shared header -> validate() throws.
header-mismatch :: runtime-tests-expectations/cases/header-mismatch :: mismatch
